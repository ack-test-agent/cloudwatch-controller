empty_shapes:
  - SlidingWindow
ignore:
  resource_names:
    - CompositeAlarm
    - InsightRule
    - ManagedInsightRule
    # - MetricStream
  field_paths:
    - PutDashboardInput.Tags
    - PutAnomalyDetectorInput.Dimensions
    - PutAnomalyDetectorInput.MetricName
    - PutAnomalyDetectorInput.Namespace
    - PutAnomalyDetectorInput.Stat
    - AnomalyDetector.Dimensions
    - AnomalyDetector.MetricName
    - AnomalyDetector.Namespace
    - AnomalyDetector.Stat
    - DeleteAnomalyDetectorInput.Dimensions
    - DeleteAnomalyDetectorInput.MetricName
    - DeleteAnomalyDetectorInput.Namespace
    - DeleteAnomalyDetectorInput.Stat
operations:
  DeleteAlarms:
    operation_type:
    - Delete
    resource_name: MetricAlarm
  DescribeAlarms:
    output_wrapper_field_path: MetricAlarms
    operation_type:
    - List
    resource_name: MetricAlarm
  PutMetricAlarm:
    operation_type:
    - Create
    - Update
    resource_name: MetricAlarm
  PutMetricStream:
    operation_type:
    - Create
    - Update
    resource_name: MetricStream
  DeleteDashboards:
    operation_type:
    - Delete
    resource_name: Dashboard
  GetDashboard:
    operation_type:
    - ReadOne
    resource_name: Dashboard
  ListDashboards:
    operation_type:
    - ReadMany
    resource_name: Dashboard
  PutDashboard:
    operation_type:
    - Create
    - Update
    resource_name: Dashboard
  PutAnomalyDetector:
    operation_type:
    - Create
    - Update
    resource_name: AnomalyDetector
  DescribeAnomalyDetectors:
    output_wrapper_field_path: AnomalyDetectors
    operation_type:
    - List
    resource_name: AnomalyDetector
  DeleteAnomalyDetector:
    operation_type:
    - Delete
    resource_name: AnomalyDetector
resources:
  AnomalyDetector:
    fields:
      AnomalyDetectorId:
        is_read_only: true
      SingleMetricAnomalyDetector:
        is_immutable: true
      MetricMathAnomalyDetector:
        is_immutable: true
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/anomaly_detector/sdk_read_many_post_build_request.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/anomaly_detector/sdk_delete_post_build_request.go.tpl
    exceptions:
      terminal_codes:
        - InvalidParameterCombinationException
        - MissingRequiredParameterException
    tags:
      ignore: true
  MetricStream:
    fields:
      RoleARN:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      FirehoseARN:
        references:
          service_name: firehose
          resource: DeliveryStream
          path: Status.ACKResourceMetadata.ARN
  MetricAlarm:
    fields:
      Name:
        is_primary_key: true
        is_required: true
      AlarmArn:
        is_arn: true
    renames:
      operations:
        PutMetricAlarm:
          input_fields:
            AlarmName: Name
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/metricalarm/sdk_read_many_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/metricalarm/sdk_read_many_post_set_output.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/metricalarm/sdk_delete_post_build_request.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/metricalarm/sdk_update_pre_build_request.go.tpl
  Dashboard:
    fields:
      DashboardName:
        is_primary_key: true
        is_required: true
      DashboardBody:
        is_document: true
        is_required: true
      DashboardArn:
        is_read_only: true

    hooks:
      sdk_delete_post_build_request:
        template_path: hooks/dashboard/sdk_delete_post_build_request.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFound
      terminal_codes:
        - InvalidParameterValueException
        - InvalidParameterInput
    tags:
      ignore: true
