empty_shapes:
  - SlidingWindow
ignore:
  resource_names:
    - AnomalyDetector
    - CompositeAlarm
    - ManagedInsightRule
    # - MetricStream
  field_paths:
    - PutDashboardInput.Tags
operations:
  DeleteAlarms:
    operation_type:
    - Delete
    resource_name: MetricAlarm
  DescribeAlarms:
    output_wrapper_field_path: MetricAlarms
    operation_type:
    - List
    resource_name: MetricAlarm
  PutMetricAlarm:
    operation_type:
    - Create
    - Update
    resource_name: MetricAlarm
  PutMetricStream:
    operation_type:
    - Create
    - Update
    resource_name: MetricStream
  DeleteDashboards:
    operation_type:
    - Delete
    resource_name: Dashboard
  GetDashboard:
    operation_type:
    - ReadOne
    resource_name: Dashboard
  ListDashboards:
    operation_type:
    - ReadMany
    resource_name: Dashboard
  PutDashboard:
    operation_type:
    - Create
    - Update
    resource_name: Dashboard
  PutInsightRule:
    operation_type:
    - Create
    - Update
    resource_name: InsightRule
  DescribeInsightRules:
    output_wrapper_field_path: InsightRules
    operation_type:
    - ReadMany
    resource_name: InsightRule
  DeleteInsightRules:
    operation_type:
    - Delete
    resource_name: InsightRule
resources:
  InsightRule:
    list_operation:
      match_fields:
        - RuleName
    fields:
      RuleName:
        is_primary_key: true
        is_immutable: true
        is_required: true
      RuleDefinition:
        is_required: true
      Schema:
        is_read_only: true
        from:
          operation: DescribeInsightRules
          path: InsightRules.Schema
      ManagedRule:
        is_read_only: true
        from:
          operation: DescribeInsightRules
          path: InsightRules.ManagedRule
    renames:
      operations:
        DescribeInsightRules:
          output_fields:
            Name: RuleName
            Definition: RuleDefinition
            State: RuleState
    hooks:
      sdk_delete_post_build_request:
        template_path: hooks/insight_rule/sdk_delete_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/insight_rule/sdk_read_many_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/insight_rule/sdk_update_pre_build_request.go.tpl
    exceptions:
      terminal_codes:
        - InvalidParameterValueException
        - LimitExceededException
        - MissingRequiredParameterException
  MetricStream:
    fields:
      RoleARN:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      FirehoseARN:
        references:
          service_name: firehose
          resource: DeliveryStream
          path: Status.ACKResourceMetadata.ARN
  MetricAlarm:
    fields:
      Name:
        is_primary_key: true
        is_required: true
      AlarmArn:
        is_arn: true
    renames:
      operations:
        PutMetricAlarm:
          input_fields:
            AlarmName: Name
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/metricalarm/sdk_read_many_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/metricalarm/sdk_read_many_post_set_output.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/metricalarm/sdk_delete_post_build_request.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/metricalarm/sdk_update_pre_build_request.go.tpl
  Dashboard:
    fields:
      DashboardName:
        is_primary_key: true
        is_required: true
      DashboardBody:
        is_document: true
        is_required: true
      DashboardArn:
        is_read_only: true

    hooks:
      sdk_delete_post_build_request:
        template_path: hooks/dashboard/sdk_delete_post_build_request.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFound
      terminal_codes:
        - InvalidParameterValueException
        - InvalidParameterInput
    tags:
      ignore: true
